services:
  app:
    image: 1052666/1052-os:latest
    container_name: 1052-os
    restart: unless-stopped
    ports:
      - "10052:80"
    volumes:
      - app-data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=10053
  mosquitto:
    build: ./mosquitto
    container_name: 1052os-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "5"]
      interval: 5s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  app-data:
